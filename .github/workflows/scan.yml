name: forex-alert-bot

on:
  schedule:
    # All times are UTC. H4 candles close at 01, 05, 09, 13, 17 and 21 UTC (02, 06, 10, 14, 18 and 22 in Lagos).
    # Right after each close the bot checks six times (minutes 02, 07, 12, 17, 27, 42), so the alert goes out
    # as soon as GitHub starts one of these runs. A run with no new H4 candle ends in seconds.
    - cron: "2,7,12,17,27,42 1,5,9,13,17,21 * * *"
    # Safety net for symbols whose H4 candles close at a different time (for example gold): once an hour.
    - cron: "32 * * * *"
  workflow_dispatch:            # lets you press "Run workflow" manually
    inputs:
      mode:
        description: "scan = normal run | check = test the data feed | baseline = mark current setups as seen, send nothing"
        type: choice
        default: scan
        options:
          - scan
          - check
          - baseline

permissions:
  contents: write               # needed to save alert_state.json back to the repo

concurrency:
  group: fxbot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run the bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TV_USER: ${{ secrets.TV_USER }}
          TV_PASS: ${{ secrets.TV_PASS }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            check) python forex_alert_bot.py --check ;;
            baseline) python forex_alert_bot.py --baseline ;;
            *) python forex_alert_bot.py --once ;;
          esac

      - name: Save memory of sent alerts
        run: |
          [ -f alert_state.json ] || echo "{}" > alert_state.json
          date -u +%F > heartbeat.txt
          git config user.name "fxbot"
          git config user.email "fxbot@users.noreply.github.com"
          git add alert_state.json heartbeat.txt
          git diff --staged --quiet || (git commit -m "update state" && git push)
